<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man Canvas Optimizado</title>
    <link rel="stylesheet" href="pac_man.css">
</head>
<body>
    <h1 class="game-title">PAC-MAN</h1>
    
    <div class="game-container">
        <div class="score-board">
            <div>Puntuación: <span id="score">0</span></div>
            <div>Nivel: <span id="level">1</span></div>
            <div>Vidas: <span id="lives">3</span></div>
        </div>
        
        <canvas id="game-canvas"></canvas>
        
        <div id="start-screen" class="start-screen">
            <h2>PAC-MAN</h2>
            <p class="controls-info">Mueve el ratón para dirigir a Pac-Man</p>
            <button id="start-btn" class="btn">INICIAR JUEGO</button>
        </div>
    </div>

    <!-- Sonidos -->
    <audio id="eat-sound" src="assets/eat.wav"></audio>
    <audio id="powerup-sound" src="assets/powerup.mp3"></audio>

    <script src="pac_man.js"></script>
</body>
</html>
